<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#000000">

  <title>KXFLIX</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================================
       ÉCRAN DE MOT DE PASSE
  ========================================== -->

  <div id="password-screen">

    <div class="password-box">

      <div class="password-logo">
        KX
      </div>

      <h1>KXFLIX</h1>

      <p>Entrez le code pour continuer</p>

      <input
        type="password"
        id="password-input"
        maxlength="2"
        autocomplete="off"
        autocapitalize="characters"
        spellcheck="false"
        placeholder="••"
      >

      <button
        id="password-button"
        type="button"
      >
        ENTRER
      </button>

      <div id="password-error">
        Code incorrect
      </div>

    </div>

  </div>


  <!-- =========================================
       SITE
  ========================================== -->

  <div id="site">

    <!-- Lumières rouges -->

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>
    <div class="background-glow glow-three"></div>


    <!-- HEADER -->

    <header>
      <h1>KXFLIX</h1>
    </header>


    <main>

      <!-- =====================================
           CARROUSEL
      ====================================== -->

      <section class="carousel-wrapper">

        <button
          class="carousel-arrow arrow-left"
          id="arrow-left"
          type="button"
          aria-label="Film précédent"
        >
          ‹
        </button>


        <div
          class="carousel"
          id="carousel"
        >

          <div
            class="film-track"
            id="film-track"
          >


            <!-- =================================
                 GROUPE 1
            ================================== -->

            <div class="film-group">


              <!-- OBSESSION -->

              <article
                class="film"
                data-film="0"
                data-url="https://vrodaz.com/iframe/ed176505"
              >

                <img
                  src="https://m.media-amazon.com/images/S/pv-target-images/86c0f135b4699427fc84684b09990c0bbb69a41b2921fc577dcd0fbf59851bc6._UR1920,1080_.jpg"
                  alt="Obsession"
                  draggable="false"
                >

                <div class="film-name">
                  Obsession
                </div>

              </article>


              <!-- TOY STORY 5 -->

              <article
                class="film"
                data-film="1"
                data-url="https://fradov.com/iframe/78e64c70"
              >

                <img
                  src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRA7j43OjYSL25Vukor9_5_nPm3sfohjI1bt0DNTU2o8UyiWqsZMNyhDR98&s=10"
                  alt="Toy Story 5"
                  draggable="false"
                >

                <div class="film-name">
                  Toy Story 5
                </div>

              </article>


              <!-- SPIDER-MAN NEW GENERATION -->

              <article
                class="film"
                data-film="2"
                data-url="https://sharecloudy.com/iframe/Bm7bBpnpaN"
              >

                <img
                  src="https://snworksceo.imgix.net/ttd/86058c86-ffe3-45ff-bd60-f6f8d28dbdd1.sized-1000x1000.jpg?w=800&dpr=2&ar=16%3A9&fit=crop&crop=faces"
                  alt="Spider-Man : New Generation"
                  draggable="false"
                >

                <div class="film-name">
                  Spider-Man : New Generation
                </div>

              </article>


              <!-- SPIDER-MAN ACROSS -->

              <article
                class="film"
                data-film="3"
                data-url="https://sharecloudy.com/iframe/1V4HHtvvKr"
              >

                <img
                  src="https://beam-images.warnermediacdn.com/BEAM_LWM_DELIVERABLES/08f3260f-1512-4c90-a3df-fc2e407ba708/d5f22ff0-d35b-420a-bc64-3d5f9ba3818b?host=wbd-images.prod-vod.h264.io&partner=beamcom"
                  alt="Spider-Man : Across the Spider-Verse"
                  draggable="false"
                >

                <div class="film-name">
                  Spider-Man : Across the Spider-Verse
                </div>

              </article>


              <!-- SCREAM 7 -->

              <article
                class="film"
                data-film="4"
                data-url="https://vromov.com/iframe/iqdDB5G1i2"
              >

                <img
                  src="https://m.media-amazon.com/images/S/aplus-media-library-service-media/8c932462-5fed-4a21-bfd3-275636f21e0b.__CR0,0,1940,1200_PT0_SX970_V1___.jpg"
                  alt="Scream 7"
                  draggable="false"
                >

                <div class="film-name">
                  Scream 7
                </div>

              </article>

            </div>


            <!-- =================================
                 GROUPE 2
                 COPIE POUR LA BOUCLE
            ================================== -->

            <div
              class="film-group"
              aria-hidden="true"
            >


              <!-- OBSESSION -->

              <article
                class="film"
                data-film="0"
                data-url="https://vrodaz.com/iframe/ed176505"
              >

                <img
                  src="https://m.media-amazon.com/images/S/pv-target-images/86c0f135b4699427fc84684b09990c0bbb69a41b2921fc577dcd0fbf59851bc6._UR1920,1080_.jpg"
                  alt=""
                  draggable="false"
                >

                <div class="film-name">
                  Obsession
                </div>

              </article>


              <!-- TOY STORY 5 -->

              <article
                class="film"
                data-film="1"
                data-url="https://fradov.com/iframe/78e64c70"
              >

                <img
                  src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRA7j43OjYSL25Vukor9_5_nPm3sfohjI1bt0DNTU2o8UyiWqsZMNyhDR98&s=10"
                  alt=""
                  draggable="false"
                >

                <div class="film-name">
                  Toy Story 5
                </div>

              </article>


              <!-- SPIDER-MAN NEW GENERATION -->

              <article
                class="film"
                data-film="2"
                data-url="https://sharecloudy.com/iframe/Bm7bBpnpaN"
              >

                <img
                  src="https://snworksceo.imgix.net/ttd/86058c86-ffe3-45ff-bd60-f6f8d28dbdd1.sized-1000x1000.jpg?w=800&dpr=2&ar=16%3A9&fit=crop&crop=faces"
                  alt=""
                  draggable="false"
                >

                <div class="film-name">
                  Spider-Man : New Generation
                </div>

              </article>


              <!-- SPIDER-MAN ACROSS -->

              <article
                class="film"
                data-film="3"
                data-url="https://sharecloudy.com/iframe/1V4HHtvvKr"
              >

                <img
                  src="https://beam-images.warnermediacdn.com/BEAM_LWM_DELIVERABLES/08f3260f-1512-4c90-a3df-fc2e407ba708/d5f22ff0-d35b-420a-bc64-3d5f9ba3818b?host=wbd-images.prod-vod.h264.io&partner=beamcom"
                  alt=""
                  draggable="false"
                >

                <div class="film-name">
                  Spider-Man : Across the Spider-Verse
                </div>

              </article>


              <!-- SCREAM 7 -->

              <article
                class="film"
                data-film="4"
                data-url="https://vromov.com/iframe/iqdDB5G1i2"
              >

                <img
                  src="https://m.media-amazon.com/images/S/aplus-media-library-service-media/8c932462-5fed-4a21-bfd3-275636f21e0b.__CR0,0,1940,1200_PT0_SX970_V1___.jpg"
                  alt=""
                  draggable="false"
                >

                <div class="film-name">
                  Scream 7
                </div>

              </article>

            </div>

          </div>

        </div>


        <button
          class="carousel-arrow arrow-right"
          id="arrow-right"
          type="button"
          aria-label="Film suivant"
        >
          ›
        </button>

      </section>


      <!-- INDICATEUR MOBILE -->

      <div class="mobile-hint">
        <span>←</span>
        Glissez pour parcourir
        <span>→</span>
      </div>


      <!-- TELEGRAM -->

      <div class="telegram">

        <a
          href="https://t.me/kxback"
          target="_blank"
          rel="noopener noreferrer"
        >
          Telegram
        </a>

      </div>

    </main>


    <!-- =========================================
         LECTEUR
    ========================================== -->

    <div
      id="lecteur"
      aria-hidden="true"
    >

      <button
        id="fermer"
        type="button"
        aria-label="Fermer"
      >
        ✕
      </button>

      <div class="video-container">

        <iframe
          id="video"
          src=""
          title="KXFLIX"
          allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
          allowfullscreen
          frameborder="0"
        ></iframe>

      </div>

    </div>

  </div>


  <script src="script.js"></script>

</body>
</html>
